<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Open PO SMIK FANS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      text-align: center;
      padding: 30px 0 20px;
    }

    header h1 {
      font-size: 2rem;
      color: #000;
      margin-bottom: 8px;
    }

    header p { color: #888; font-size: 0.95rem; }

    /* Stats */
    .stats {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .stat-card {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
      min-width: 130px;
    }

    .stat-card .num {
      font-size: 1.8rem;
      font-weight: 700;
      color: #000;
    }

    .stat-card .label {
      font-size: 0.78rem;
      color: #888;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin: 20px 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      color: #000;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.3s;
    }

    .search-box::placeholder { color: #999; }
    .search-box:focus { border-color: #333; }

    select {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      color: #000;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    select option { background: #fff; color: #222; }

    /* Table */
    .table-wrap {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: #f5f5f5;
      padding: 14px 16px;
      text-align: left;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #555;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-bottom: 2px solid #e0e0e0;
    }

    thead th:hover { background: #eee; }

    tbody tr {
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    tbody tr:hover { background: #f9f9f9; }

    tbody td {
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #000;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-paid {
      background: rgba(46, 213, 115, 0.2);
      color: #2ed573;
      border: 1px solid rgba(46, 213, 115, 0.3);
    }

    .badge-unpaid {
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    .badge-partial {
      background: rgba(255, 165, 2, 0.2);
      color: #ffa502;
      border: 1px solid rgba(255, 165, 2, 0.3);
    }

    .color-hitam {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #222;
      border: 1px solid #555;
      vertical-align: middle;
      margin-right: 6px;
    }

    .color-putih {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #ccc;
      vertical-align: middle;
      margin-right: 6px;
    }

    .no-data {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: #aaa;
      font-size: 0.8rem;
    }

    @media (max-width: 700px) {
      header h1 { font-size: 1.4rem; }
      .stats { gap: 8px; }
      .stat-card { min-width: 100px; padding: 12px 16px; }
      .stat-card .num { font-size: 1.4rem; }
      thead th, tbody td { padding: 10px 10px; font-size: 0.8rem; }
      .table-wrap { overflow-x: auto; }
    }
  </style>
</head>

      <select id="filterSize">

      </select>
      <select id="filterSleeve">

        <option value="Panjang">🧴 Panjang (LP)</option>

    <div class="table-wrap">
      <table>

            <th>#</th>
            <th onclick="sortBy('name')">Nama ↕</th>

            <th onclick="sortBy('color')">Warna ↕</th>
            <th onclick="sortBy('sleeve')">Lengan ↕</th>
            <th onclick="sortBy('status')">Status ↕</th>

        <tbody id="tableBody"></tbody>

    </div>

136.nopal XII TKJ 3 (L) hitam☑️\n137.awi XII KKKR 1 (L) hitam`.trim().split('\n');

    // Parse data
    const sizes = ['S', 'M', 'L', 'XL', '2XL', '3XL', '4XL'];

    function parseLine(line, idx) {
      line = line.trim();
      // Extract status
      let status = 'unpaid';
      if (/✅/.test(line)) status = 'paid';
      else if (/☑️/.test(line)) status = 'partial';

      // Extract LP (Lengan Panjang)
      let sleeve = 'Pendek';
      if (/\bLP\b|\bLp\b/i.test(line)) sleeve = 'Panjang';

      // Extract color
      let color = 'hitam';
      if (/\b(putih)\b/i.test(line)) color = 'putih';
      else if (/\b(hitam|hita)\b/i.test(line)) color = 'hitam';

      // Extract size (handle both parenthesized and non-parenthesized)
      let size = '';
      const sizeMatch = line.match(/\(([^)]*?)\)/);
      if (sizeMatch) {
        size = sizeMatch[1].trim().toUpperCase().replace(/\s/g, '');
      } else {
        // Try non-parenthesized size like 'M Putih' or 'XL)hitam'
        const sizeMatch2 = line.match(/\b(S|M|L|XL|XXL|2XL|3XL|4XL)\b/i);
        if (sizeMatch2) size = sizeMatch2[1].toUpperCase();
      }

      // Normalize numeric grades to Roman numerals
      const romanMap = {'10':'X','11':'XI','12':'XII'};
      let normalized = line
        .replace(/\b(\d{1,2})\s+(tkj|kklp|kkkr|dpk|dtf|dkv|tf|tjkt|logam)/gi, (m, num, dept) => {
          return (romanMap[num] || num) + ' ' + dept;
        })
        .replace(/\b(\d{1,2})\s+(kkkr|kklp|dpk)/gi, (m, num, dept) => {
          return (romanMap[num] || num) + ' ' + dept;
        })
        // Handle cases like 'Syafiq X TJKT 3' without space before dept number
        .replace(/\b(tkj|kklp|kkkr|dpk|dtf|dkv|tf|tjkt|logam)(\d)/gi, '$1 $2');

      // Extract name: clean up the line for name extraction
      let namePart = normalized
        .replace(/^\d+[.,)\s]*/, '')
        .replace(/✅|☑️/g, '')
        .replace(/\bLP\b/gi, '')
        .replace(/\d+k\b/gi, '')
        .replace(/\(\d+\)/g, '')
        .trim();

      // Grade patterns: X, XI, XII (and variations like Xl, Xll, xl)
      // Match grade that appears BEFORE a department keyword or size parenthesis
      const gradeRegex = /\b(X{1,2}l{0,2}|xl{0,2}|XII|XI)\s+(?:tkj|kklp|kkkr|dpk|dtf|dkv|tf|tjkt|logam|alumni)/i;
      let name = namePart;
      let grade = '';
      let dept = '';

      const gradeMatch = namePart.match(gradeRegex);
      if (gradeMatch) {
        name = namePart.substring(0, gradeMatch.index).trim();
        grade = gradeMatch[1];
        // Get dept: everything from the department keyword onward (before size)
        const afterGrade = namePart.substring(gradeMatch.index + gradeMatch[1].length).trim();
        dept = afterGrade.replace(/\s*\([^)]*\).*/, '').replace(/[.✅☑️,]/g, '').trim();
      }

      // Normalize grade to standard format
      grade = grade.toUpperCase()
        .replace(/^XL$/, 'XII')
        .replace(/^XLL$/, 'XII')
        .replace(/^X$/, 'X');

      // Normalize dept abbreviations
      dept = dept.toUpperCase()
        .replace(/^KKR$/, 'KKKR')
        .replace(/^KLLP$/, 'KKLP')
        .replace(/^TF$/, 'TF')
        .replace(/^DKV$/, 'DKV')
        .replace(/^DTF$/, 'DTF')
        .replace(/^DPK$/, 'DPK')
        .replace(/^TKJ$/, 'TKJ')
        .replace(/^TJKT$/, 'TJKT')
        .replace(/^LOGAM$/, 'LOGAM')
        .replace(/^ALUMNI$/, 'ALUMNI')
        .trim();

      // Clean name
      name = name.replace(/[.,]/g, '').trim();
      if (!name) name = 'Unknown';

      return {
        num: idx + 1,
        name: name.charAt(0).toUpperCase() + name.slice(1),
        grade: grade,
        dept: dept,
        size: size,
        color: color,
        sleeve: sleeve,
        status: status,
        raw: line
      };
    }

    let data = rawLines.map((line, i) => parseLine(line, i));

    // Populate size filter
    const allSizes = [...new Set(data.map(d => d.size).filter(Boolean))].sort();
    const sizeSelect = document.getElementById('filterSize');
    allSizes.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sizeSelect.appendChild(opt);
    });

    // Render
    let sortKey = '';
    let sortAsc = true;

    function render() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('filterStatus').value;
      const colorFilter = document.getElementById('filterColor').value;
      const sizeFilter = document.getElementById('filterSize').value;
      const sleeveFilter = document.getElementById('filterSleeve').value;

      let filtered = data.filter(d => {
        if (query && !(d.name.toLowerCase().includes(query) ||
            d.grade.toLowerCase().includes(query) ||
            d.dept.toLowerCase().includes(query) ||
            d.raw.toLowerCase().includes(query))) return false;
        if (statusFilter !== 'all' && d.status !== statusFilter) return false;
        if (colorFilter !== 'all' && d.color !== colorFilter) return false;
        if (sizeFilter !== 'all' && d.size.toUpperCase() !== sizeFilter.toUpperCase()) return false;
        if (sleeveFilter !== 'all' && d.sleeve !== sleeveFilter) return false;
        return true;
      });

      // Sort
      if (sortKey) {
        filtered.sort((a, b) => {
          const va = a[sortKey] || '';
          const vb = b[sortKey] || '';
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
      }

      // Stats
      const total = data.length;
      const paidCount = data.filter(d => d.status === 'paid').length;
      const partialCount = data.filter(d => d.status === 'partial').length;
      const unpaidCount = data.filter(d => d.status === 'unpaid').length;
      const hitamCount = data.filter(d => d.color === 'hitam').length;
      const putihCount = data.filter(d => d.color === 'putih').length;
      const panjangCount = data.filter(d => d.sleeve === 'Panjang').length;

      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><div class="num">${total}</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="num" style="color:#2ed573">${paidCount}</div><div class="label">Lunas</div></div>
        <div class="stat-card"><div class="num" style="color:#ffa502">${partialCount}</div><div class="label">DP / Sebagian</div></div>
        <div class="stat-card"><div class="num" style="color:#ff4757">${unpaidCount}</div><div class="label">Belum Bayar</div></div>
        <div class="stat-card"><div class="num">${hitamCount} / ${putihCount}</div><div class="label">Hitam / Putih</div></div>
        <div class="stat-card"><div class="num" style="color:#000">${panjangCount}</div><div class="label">Lengan Panjang</div></div>
      `;

      document.getElementById('subtitle').textContent = `${filtered.length} dari ${total} pesanan ditampilkan`;

      // Table
      const tbody = document.getElementById('tableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="no-data">😢 Tidak ada data ditemukan</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map((d, i) => {
        const statusBadge = d.status === 'paid'
          ? '<span class="badge badge-paid">✅ Lunas</span>'
          : d.status === 'partial'
          ? '<span class="badge badge-partial">☑️ DP</span>'
          : '<span class="badge badge-unpaid">❌ Belum</span>';

        const colorIcon = d.color === 'putih'
          ? '<span class="color-putih"></span>Putih'
          : '<span class="color-hitam"></span>Hitam';

        const sleeveText = d.sleeve === 'Panjang'
          ? '<span style="color:#000;font-weight:600">🧴 Panjang</span>'
          : '<span style="color:#888">👕 Pendek</span>';

        return `<tr>
          <td>${d.num}</td>
          <td><strong>${d.name}</strong></td>
          <td>${d.grade} ${d.dept}</td>
          <td>${d.size}</td>
          <td>${colorIcon}</td>
          <td>${sleeveText}</td>
          <td>${statusBadge}</td>
        </tr>`;
      }).join('');
    }

    function sortBy(key) {
      if (sortKey === key) sortAsc = !sortAsc;
      else { sortKey = key; sortAsc = true; }
      render();
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('filterStatus').addEventListener('change', render);
    document.getElementById('filterColor').addEventListener('change', render);
    document.getElementById('filterSize').addEventListener('change', render);
    document.getElementById('filterSleeve').addEventListener('change', render);

    // Initial render
    render();
  </script>
</body>
</html>
